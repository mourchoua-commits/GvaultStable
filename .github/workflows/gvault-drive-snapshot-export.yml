name: GVault Stable Drive Snapshot Export

on:
  push:
    paths:
      - '.github/workflows/gvault-drive-snapshot-export.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build immutable snapshot package
        shell: bash
        env:
          TARGET_SHA: bb36cd4d328ca8c4ee94aae6fd1a2e5c63bac4e1
          SNAPSHOT_NAME: GvaultStable-public-main-bb36cd4d328c
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_SHA}^{commit}"
          git branch -f snapshot-main "${TARGET_SHA}"
          mkdir -p snapshot
          git archive --format=zip --output="snapshot/${SNAPSHOT_NAME}-working-tree.zip" snapshot-main
          git bundle create "snapshot/${SNAPSHOT_NAME}-main-history.bundle" snapshot-main
          git ls-tree -r -l "${TARGET_SHA}" > "snapshot/${SNAPSHOT_NAME}-tree-manifest.txt"
          git log snapshot-main --date=iso-strict --pretty=format:'%H%x09%aI%x09%cI%x09%an%x09%s' > "snapshot/${SNAPSHOT_NAME}-commit-history.tsv"
          {
            echo "repository=mourchoua-commits/GvaultStable"
            echo "visibility=public"
            echo "branch=main"
            echo "snapshot_sha=${TARGET_SHA}"
            echo "workflow_trigger_sha=${GITHUB_SHA}"
            echo "created_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "contents=working-tree zip + main-history git bundle + complete tree manifest + commit history"
          } > "snapshot/${SNAPSHOT_NAME}-metadata.txt"
          (cd snapshot && sha256sum * > SHA256SUMS.txt)

      - name: Upload immutable snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: GvaultStable-public-main-bb36cd4d328c-full-snapshot
          path: snapshot/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
