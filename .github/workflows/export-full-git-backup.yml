name: Export public full Git backup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-full-git-backup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build complete Git bundles and source snapshots
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gvault-public-full"
          mkdir -p "$ROOT"

          capture() {
            repo="$1"
            name="$2"
            sha="$3"
            mirror="$RUNNER_TEMP/${name}.git"
            git clone --mirror "https://github.com/${repo}.git" "$mirror"
            git -C "$mirror" cat-file -e "${sha}^{commit}"
            git -C "$mirror" bundle create "$ROOT/${name}-complete.bundle" --all
            git clone "$mirror" "$RUNNER_TEMP/${name}-work"
            git -C "$RUNNER_TEMP/${name}-work" checkout --detach "$sha"
            git -C "$RUNNER_TEMP/${name}-work" archive --format=zip --output="$ROOT/${name}-sources.zip" "$sha"
            git -C "$mirror" show-ref > "$ROOT/${name}-refs.txt"
            git -C "$mirror" log --all --date=iso-strict --pretty=format:'%H%x09%P%x09%aI%x09%cI%x09%s' > "$ROOT/${name}-history.tsv"
            printf '%s\n' "$sha" > "$ROOT/${name}-main-sha.txt"
            git -C "$mirror" bundle verify "$ROOT/${name}-complete.bundle"
          }

          capture 'mourchoua-commits/GvaultStable' 'GvaultStable' '9572af79e1a357f6560b6383d462a06a5f113d73'
          capture 'mourchoua-commits/Gvault-Pages' 'Gvault-Pages' 'e16c15ac0d811fd6fed99d428e5158bb58171d51'

          (cd "$ROOT" && sha256sum * > SHA256SUMS.txt)
          printf '%s\n' \
            'GvaultStable-complete.bundle and Gvault-Pages-complete.bundle contain complete Git history, branches and tags retrievable from GitHub.' \
            'The *-sources.zip files contain the exact pinned source trees.' \
            > "$ROOT/README-RESTORE.txt"

      - name: Upload public full Git backup
        uses: actions/upload-artifact@v4
        with:
          name: Gvault-public-full-git-backup
          path: ${{ runner.temp }}/gvault-public-full/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
