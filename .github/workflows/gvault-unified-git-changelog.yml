name: GVault Stable Unified Git Changelog

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'publications/git-changelog/index.json'
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: write

concurrency:
  group: gvault-stable-unified-git-changelog
  cancel-in-progress: false

jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild sanitized public GThink/blob index
        run: node scripts/gvault-unify-git-changelog.mjs --visibility public --output publications/git-changelog/index.json

      - name: Verify sanitized schema and proof
        run: node scripts/gvault-unify-git-changelog.mjs --visibility public --output publications/git-changelog/index.json --verify-only

      - name: Rebase, regenerate, reverify and publish latest projection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gvault-unifier-bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/gvault-unify-git-changelog.mjs --visibility public --output publications/git-changelog/index.json
            node scripts/gvault-unify-git-changelog.mjs --visibility public --output publications/git-changelog/index.json --verify-only
            git add publications/git-changelog/index.json
            if git diff --cached --quiet; then
              echo 'No unified index change.'
              exit 0
            fi
            git commit -m 'chore(gthink-blob): refresh stable unified git changelog [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update detected; retry ${attempt}/3"
          done
          echo 'Unable to publish after 3 current-main retries.' >&2
          exit 1
