<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#050705">
<title>GvaultStable · Private Files V3</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050705}#v2{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050705}.v3state{position:fixed;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;max-width:min(78vw,520px);padding:5px 7px;border:1px solid rgba(120,255,170,.22);border-radius:7px;background:rgba(3,8,5,.84);color:#9ac9aa;font:700 6px/1.35 ui-monospace,monospace;pointer-events:none;opacity:.82}.v3state.ok{opacity:.38}
</style>
</head>
<body>
<iframe id="v2" title="GvaultStable Private Files V3" src="../private-files-v2/" allow="clipboard-read; clipboard-write"></iframe>
<div class="v3state" id="state">V3 · raccordement au CHOISIR officiel…</div>
<script>
(()=>{'use strict';
const CONTRACT='GVAULT_PRIVATE_CATALOG_CHOOSE_AS_OFFICIAL_V3_WRAPPER';
const frame=document.getElementById('v2'),state=document.getElementById('state');
const payloads=new Map();let wiredWindow=null,observer=null;const enc=new TextEncoder();
function setState(t,ok=false){state.textContent=t;state.classList.toggle('ok',!!ok)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function digest(bytes){const b=bytes instanceof ArrayBuffer?bytes:bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h),x=>x.toString(16).padStart(2,'0')).join('')}
function extOf(item){return String(item?.extension||item?.name?.split('.').pop()||'').toLowerCase()}
function textLike(item){const e=extOf(item);return ['txt','md','json','jsonl','js','mjs','css','py','yml','yaml','xml','svg','csv','log','ini','toml'].includes(e)||['document','code','documentation','workflow','protocole','donnees'].includes(String(item?.kind||''))}
function htmlLike(item){return ['html','htm'].includes(extOf(item))}
function canonicalSasSource(s){return ['lockScreenTrigger','vaultPassword','unlockBtn','projectsBtn'].every(t=>s.includes(t))}
async function buildPreview(w,item){
 const raw=await w.decryptPrivateCatalogItem(item);let bytes,transport='GVAULT_PRIVATE_FILE_MEMORY_V1';
 if(htmlLike(item)){
   const source=new TextDecoder('utf-8').decode(raw);bytes=raw;if(canonicalSasSource(source))transport='PUBLIC_CIPHERTEXT_SAS_MEMORY_ONLY';
 }else if(textLike(item)){
   let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(raw)}catch{text='[contenu non UTF-8]'}
   const doc='<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(item.path)+'</title><style>html,body{margin:0;min-height:100%;background:#070908;color:#e7eee9;font:13px/1.5 ui-monospace,monospace}header{position:sticky;top:0;padding:10px 12px;background:#0d120f;border-bottom:1px solid #2d3a32;font-weight:900;overflow-wrap:anywhere}pre{margin:0;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><header>'+esc(item.path)+'</header><pre>'+esc(text)+'</pre></body></html>';bytes=enc.encode(doc).buffer;
 }else{
   const doc='<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(item.path)+'</title><style>html,body{margin:0;min-height:100%;display:grid;place-items:center;background:#070908;color:#e7eee9;font:13px/1.5 ui-monospace,monospace}.box{max-width:560px;margin:20px;padding:18px;border:1px solid #2d3a32;border-radius:12px;background:#0d120f}.muted{opacity:.72}</style></head><body><div class="box"><b>'+esc(item.path)+'</b><p class="muted">Fichier binaire. Il est monté dans le même écran de prévisualisation que CHOISIR en haut. Pour récupérer le contenu brut, utilise OUVRIR ou TÉLÉCHARGER.</p></div></body></html>';bytes=enc.encode(doc).buffer;
 }
 const sha=await digest(bytes);return {bytes,previewItem:{releaseId:(item.state||'PRIVÉ')+' · '+item.name,sourceSha256:sha,sourceSize:bytes.byteLength,preview:{transport,path:item.path,catalogItemId:item.id}}};
}
async function choose(w,button){
 const item=w.catalogItemByButton?.(button);if(!item)throw new Error('Fichier privé introuvable.');
 if(typeof w.decryptPrivateCatalogItem!=='function')throw new Error('Transport privé V2 indisponible.');
 if(typeof w.GVaultOfficialPreview?.open!=='function')throw new Error('CHOISIR officiel indisponible.');
 setState('CHOISIR officiel · préparation de '+item.name+'…');const p=await buildPreview(w,item);payloads.set(p.previewItem.sourceSha256,p.bytes);
 try{await w.GVaultOfficialPreview.open(p.previewItem);setState('CHOISIR officiel · '+item.name,true)}finally{setTimeout(()=>payloads.delete(p.previewItem.sourceSha256),120000)}
}
function addOpenButtons(w,d){
 for(const card of d.querySelectorAll('.catalogCard')){const actions=card.querySelector('.catalogActions');if(!actions||actions.querySelector('[data-catalog-action="open-v2"]'))continue;const b=d.createElement('button');b.className='catalogAction';b.type='button';b.dataset.catalogAction='open-v2';b.textContent='OUVRIR';const dl=actions.querySelector('[data-catalog-action="download"]');actions.insertBefore(b,dl||null)}
}
function wire(){
 let w,d;try{w=frame.contentWindow;d=frame.contentDocument}catch(e){setState('V3 · accès refusé : '+e.message);return}if(!w||!d||wiredWindow===w)return;wiredWindow=w;
 w.addEventListener('gvault:request-official-preview',e=>{const x=e.detail||{},bytes=payloads.get(String(x.sourceSha256||''));if(!bytes)return;e.stopImmediatePropagation();try{x.resolve?.({bytes})}catch(err){x.reject?.(err)}},true);
 d.addEventListener('click',e=>{const b=e.target?.closest?.('[data-catalog-action]');if(!b)return;const action=b.dataset.catalogAction;if(action==='choose'){e.preventDefault();e.stopImmediatePropagation();void choose(w,b).catch(err=>{console.error(err);setState('ACTION REFUSÉE · '+(err?.message||err))});return}if(action==='open-v2'){e.preventDefault();e.stopImmediatePropagation();const item=w.catalogItemByButton?.(b);if(!item)return;Promise.resolve(w.launchPrivateCatalogItem?.(item)).catch(err=>{console.error(err);setState('OUVRIR REFUSÉ · '+(err?.message||err))})}},true);
 observer?.disconnect();observer=new MutationObserver(()=>addOpenButtons(w,d));observer.observe(d.documentElement,{childList:true,subtree:true});addOpenButtons(w,d);
 w.GVaultStablePrivateV3=Object.freeze({schema:CONTRACT,choose:'GVaultOfficialPreview.open',open:'launchPrivateCatalogItem',download:'downloadPrivateCatalogItem',v2Preserved:true});setState('V3 prête · ESSAI/PRIVÉ + CHOISIR = CHOISIR du haut · OUVRIR/TÉLÉCHARGER conservés',true)
}
frame.addEventListener('load',()=>setTimeout(wire,0));setTimeout(wire,500);
})();
</script>
<!-- GVAULT_PRIVATE_CATALOG_CHOOSE_AS_OFFICIAL_V3_WRAPPER -->
</body>
</html>
