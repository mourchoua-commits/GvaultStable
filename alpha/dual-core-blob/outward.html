<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GVAULT · Soft Egress</title><style>body{font-family:ui-monospace,monospace;background:#0b0e14;color:#e9edf5;margin:0;padding:20px}main{max-width:760px;margin:auto}.box{border:1px solid #394255;border-radius:14px;padding:16px;background:#111722}button{width:100%;padding:12px;border-radius:10px;border:1px solid #53627c;background:#182131;color:inherit;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere}.ok{color:#b8ffd0}</style></head><body><main><h1>SILLAGE · SORTIE DOUCE</h1><div class="box"><p>Tout contenu interne présenté à cette membrane est refusé sans détail et sans exception.</p><button id="probe">TESTER UNE SORTIE</button><pre id="out">READY</pre></div></main><script type="module">import{sendOutward,probeEgress,EGRESS_SCHEMA}from'./egress-membrane.mjs';window.GVaultSoftEgress={schema:EGRESS_SCHEMA,send:sendOutward,probe:probeEgress};document.querySelector('#probe').onclick=()=>{const r=sendOutward({internal:'sample'});const out=document.querySelector('#out');out.className='ok';out.textContent=JSON.stringify(r,null,2)};</script></body></html>
