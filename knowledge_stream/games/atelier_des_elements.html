<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier des éléments — Gvault</title><style>:root{font-family:system-ui;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1118;color:#eef4fa;min-height:100vh;display:grid;place-items:center}.app{width:min(100%,680px);padding:14px}.panel{background:#121d29;border:1px solid #33475b;border-radius:18px;padding:14px}h1{font-size:1.25rem;margin:0 0 8px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tabs button,.ctrl button{border:0;border-radius:10px;padding:10px;font-weight:700}.tabs button.active{outline:2px solid white}.world{height:380px;margin-top:10px;border-radius:14px;overflow:hidden;position:relative;background:#081018}.hud{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{background:#203040;padding:6px 9px;border-radius:999px}.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.orb,.ring,.grain{position:absolute;display:grid;place-items:center;font-weight:800;user-select:none}.orb{border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff8c8,#ff8a24 35%,#d12715 75%);box-shadow:0 0 28px #ff6b2b88}.ring{border:5px solid #9be8ff;border-radius:50%;box-shadow:0 0 18px #71dfff66}.grain{background:#b9915a;border-radius:25%}.target{position:absolute;border:2px dashed #fff8;border-radius:14px}.msg{min-height:24px;margin-top:8px;opacity:.9}</style></head><body><main class="app"><section class="panel"><h1>Atelier des éléments</h1><div class="tabs"><button data-mode="FEU">FEU</button><button data-mode="AIR">AIR</button><button data-mode="TERRE">TERRE</button></div><div class="hud"><span class="chip">Score <b id="score">0</b></span><span class="chip">Mode <b id="mode">FEU</b></span></div><div id="world" class="world"></div><div class="ctrl"><button id="left">◀</button><button id="right">▶</button></div><div id="msg" class="msg"></div></section></main><script>const world=document.querySelector('#world'),scoreEl=document.querySelector('#score'),modeEl=document.querySelector('#mode'),msg=document.querySelector('#msg');let mode='FEU',score=0,x=150,v=0,t=0,stack=0;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function reset(){score=0;x=world.clientWidth/2;v=0;t=0;stack=0;msg.textContent='';render()}function render(){world.innerHTML='';modeEl.textContent=mode;scoreEl.textContent=Math.floor(score);const w=world.clientWidth,h=world.clientHeight;if(mode==='FEU'){const target=document.createElement('div');target.className='target';target.style.cssText=`left:${w/2-55}px;top:${h/2-70}px;width:110px;height:140px`;world.appendChild(target);const o=document.createElement('div');o.className='orb';o.style.cssText=`width:76px;height:76px;left:${x-38}px;top:${h/2-38}px`;o.textContent='🔥';world.appendChild(o)}else if(mode==='AIR'){for(let i=0;i<4;i++){const r=document.createElement('div');r.className='ring';r.style.cssText=`width:${64+i*8}px;height:${64+i*8}px;left:${w*(.15+i*.2)-35}px;top:${70+(i%2)*135}px`;world.appendChild(r)}const o=document.createElement('div');o.className='ring';o.style.cssText=`width:42px;height:42px;left:${x-21}px;top:${h/2-21}px;border-color:#fff`;o.textContent='↻';world.appendChild(o)}else{for(let i=0;i<stack;i++){const g=document.createElement('div');g.className='grain';g.style.cssText=`width:${70-i*3}px;height:26px;left:${w/2-(70-i*3)/2+(i%2?8:-8)}px;bottom:${i*24+12}px`;world.appendChild(g)}msg.textContent=stack>=10?'Tour stable atteinte. Production réussie.':'Empile sans dépasser l’équilibre.'}}function step(dir){const w=world.clientWidth;if(mode==='TERRE'){if(dir>0){stack++;score+=10}else{stack=Math.max(0,stack-1);score=Math.max(0,score-3)}render();return}v+=dir*2.3;x=clamp(x+v*4,28,w-28);v*=.72;if(mode==='FEU'){const d=Math.abs(x-w/2);score+=Math.max(0,12-d/12);msg.textContent=d<45?'Flamme dans la zone stable.':'Ramène la flamme vers la zone.'}else{score+=4;msg.textContent='Guide le vortex entre les anneaux.'}render()}document.querySelector('#left').onclick=()=>step(-1);document.querySelector('#right').onclick=()=>step(1);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));reset()});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});document.querySelector('[data-mode="FEU"]').classList.add('active');reset();</script></body></html>
